<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore fotógrafos de diferentes estilos e conheça seus portfólios no PhotoFrame.">
    <title>PhotoFrame - Explorar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📷%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="page" data-page="explorar">

    <!-- CABEÇALHO SUPERIOR -->
    <header class="navbar">
        <div class="logo"><a href="index.html">PHOTOFRAME</a></div>
        <nav class="nav-links" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="explorar.html" class="active" aria-current="page">Explorar</a>
            <a href="dashboard.html">Meu Perfil</a>
        </nav>
    </header>

    <main class="container">
        <!-- TÍTULO E FILTROS -->
        <section class="explore-header">
            <div>
                <h1>Fotógrafos em destaque</h1>
                <p>Conheça diferentes fotógrafos, estilos e histórias através da fotografia.</p>
            </div>
            <div class="explore-controls">
                <input type="search" id="search" class="search-input" placeholder="Buscar fotógrafo..." aria-label="Buscar fotógrafo por nome" autocomplete="off">
                <div class="filter-pills" role="group" aria-label="Filtrar por categoria">
                    <button type="button" class="pill active" data-filter="todos" aria-pressed="true">Todos</button>
                    <button type="button" class="pill" data-filter="documental" aria-pressed="false">Documental</button>
                    <button type="button" class="pill" data-filter="retrato" aria-pressed="false">Retrato</button>
                    <button type="button" class="pill" data-filter="paisagem" aria-pressed="false">Paisagem</button>
                    <button type="button" class="pill" data-filter="arquitetura" aria-pressed="false">Arquitetura</button>
                </div>
            </div>
        </section>

        <!-- GRADE DE FOTÓGRAFOS (preenchida pelo JavaScript) -->
        <section class="photographers-grid" id="photographers-grid" aria-live="polite"></section>

        <p class="empty-state" id="empty-state" hidden>Nenhum fotógrafo encontrado para esse filtro.</p>

        <div class="load-more" id="load-more" hidden>
            <button type="button" class="btn-outline" id="load-more-btn">CARREGAR MAIS</button>
        </div>
    </main>

    <footer>
        <span>PHOTOFRAME</span>
        <span>&copy; 2026 PhotoFrame. Todos os direitos reservados.</span>
    </footer>

</body>
</html>
