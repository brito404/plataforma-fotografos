<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de fotógrafo no PhotoFrame.">
    <title>PhotoFrame - Perfil</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📷%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="page" data-page="perfil">

    <header class="navbar navbar-dark">
        <div class="logo"><a href="index.html">PHOTOFRAME</a></div>
        <nav class="nav-links" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="explorar.html">Explorar</a>
            <a href="dashboard.html">Meu Perfil</a>
        </nav>
    </header>

    <section class="profile-hero">
        <a href="explorar.html" class="back-link">← Voltar para explorar</a>

        <div class="profile-container" id="profile-container">
            <div class="profile-avatar">
                <img id="profile-avatar-img" src="images/logoperfil.png" alt="">
            </div>
            <div class="profile-info">
                <h1 id="profile-name">Carregando...</h1>
                <p class="subtitle" id="profile-role"></p>
                <p class="location" id="profile-location"></p>
                <p class="bio" id="profile-bio"></p>
                <div class="profile-actions">
                    <a href="https://wa.me/" class="btn-whatsapp" id="btn-whatsapp" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">💬</span> WhatsApp</a>
                    <!-- Aparece só no perfil do "dono" (simulação de login) -->
                    <a href="dashboard.html" class="btn-manage" id="btn-manage" hidden><span aria-hidden="true">⚙️</span> Gerenciar Perfil</a>
                </div>
            </div>
        </div>

        <p class="not-found" id="not-found" hidden>Fotógrafo não encontrado. <a href="explorar.html">Voltar para explorar</a></p>
    </section>

    <main class="container">
        <h2>Portfólio</h2>
        <div class="portfolio-grid" id="portfolio-grid"></div>
        <p class="empty-state" id="portfolio-empty" hidden>Este fotógrafo ainda não publicou fotos.</p>
    </main>

    <footer>
        <span>PHOTOFRAME</span>
        <span>&copy; 2026 PhotoFrame. Todos os direitos reservados.</span>
    </footer>

</body>
</html>
