<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoFrame - Imagem Expandida</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black-view">

    <header class="navbar navbar-dark">
        <div class="logo"><a href="perfil.html">PHOTOFRAME</a></div>
    </header>

    <main class="lightbox-container">
        <button class="nav-arrow left">&lt;</button>

        <div class="main-image-view">
            <img src="images/fotopaulo1.png" alt="Imagem Expandida">
        </div>

        <button class="nav-arrow right">&gt;</button>
    </main>

    <div class="thumbnails-bar">
        <div class="thumbs">
            <img src="images/fotopaulo1.png" alt="thumb">
            <img src="images/fotopaulo2.png" class="active-thumb" alt="thumb">
            <img src="images/fotopaulo3.png" alt="thumb">
            <img src="images/fotopaulo4.png" alt="thumb">
        </div>
        <span class="counter">03/12</span>
    </div>

</body>
</html>
