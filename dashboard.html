<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoFrame - Painel do Fotógrafo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📷%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="dashboard-body" data-page="dashboard">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <div class="logo"><a href="index.html">PHOTOFRAME</a></div>
        <nav class="sidebar-nav" aria-label="Menu principal">
            <a href="index.html"><span class="icon" aria-hidden="true">🏠</span> Início</a>
            <a href="explorar.html"><span class="icon" aria-hidden="true">🧭</span> Explorar</a>
            <a href="perfil.html?id=1"><span class="icon" aria-hidden="true">🖼️</span> Meu Portfólio</a>
            <a href="dashboard.html" class="active" aria-current="page"><span class="icon" aria-hidden="true">👤</span> Meu Perfil</a>
            <a href="index.html" class="logout"><span class="icon" aria-hidden="true">🚪</span> Sair</a>
        </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL (DASHBOARD) -->
    <div class="dashboard-container">

        <main class="dashboard-main">

            <!-- HEADER DO PERFIL -->
            <section class="profile-header-card">
                <div class="avatar-container">
                    <img id="avatar-img" class="avatar-img" src="images/logoperfil.png" alt="Foto de perfil">
                    <button type="button" class="avatar-overlay" id="avatar-btn" aria-label="Alterar foto de perfil">
                        <span class="icon" aria-hidden="true">📷</span>
                        <span>Alterar foto</span>
                    </button>
                    <input type="file" id="avatar-input" accept="image/*" hidden>
                </div>

                <div class="profile-header-info">
                    <h1 id="dash-name">Paulo Giovanni</h1>
                    <p class="role" id="dash-role">Fotógrafo documental</p>
                    <p class="location">São Paulo, Brasil</p>
                    <p class="bio-summary" id="dash-bio"></p>
                    <button type="button" class="btn-edit-profile" id="edit-btn">✏️ Editar perfil</button>
                </div>
            </section>

            <!-- SEÇÃO DE GESTÃO DO PORTFÓLIO -->
            <section class="portfolio-manager">
                <div class="portfolio-actions-header">
                    <h2>Meu portfólio <span class="photo-count" id="photo-count"></span></h2>
                    <button type="button" class="btn-add-photos" id="add-photos-btn">☁️ Adicionar fotos</button>
                    <input type="file" id="photos-input" accept="image/*" multiple hidden>
                </div>

                <div class="dashboard-photo-grid" id="dash-grid"></div>
                <p class="empty-state dark-text" id="dash-empty" hidden>Você ainda não adicionou fotos.</p>
            </section>

        </main>

        <!-- PAINEL LATERAL DIREITO (EDIÇÃO) -->
        <aside class="edit-profile-modal" id="edit-panel" aria-labelledby="edit-title" hidden>
            <h2 id="edit-title">Editar Perfil</h2>

            <form class="edit-form" id="edit-form">
                <div class="form-group">
                    <label for="fullname">Nome completo *</label>
                    <input type="text" id="fullname" name="fullname" required minlength="3" maxlength="60" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="category">Categoria principal *</label>
                    <select id="category" name="category" required>
                        <option value="documental">Fotógrafo documental</option>
                        <option value="retrato">Fotógrafo de retrato</option>
                        <option value="paisagem">Fotógrafo de paisagem</option>
                        <option value="arquitetura">Fotógrafo de arquitetura</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Telefone / WhatsApp *</label>
                    <input type="tel" id="phone" name="phone" required
                           pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}"
                           placeholder="(11) 98765-4321" autocomplete="tel"
                           title="Use o formato (11) 98765-4321">
                </div>

                <div class="form-group">
                    <label for="bio">Biografia *</label>
                    <textarea id="bio" name="bio" rows="5" maxlength="500" required></textarea>
                    <span class="char-count" id="char-count" aria-live="polite">0/500</span>
                </div>

                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="cancel-btn">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar</button>
                </div>
            </form>
        </aside>

    </div>

</body>
</html>
